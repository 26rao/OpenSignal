name: OpenSignal CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Unit tests (no Bright Data required)
        env:
          PYTHONPATH: src
        run: pytest tests/ -q
      - name: Local status
        env:
          PYTHONPATH: src
        run: python -m opensignal.cli status
